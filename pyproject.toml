[tool.ruff]
exclude = ["build", "venv", ".venv"]

[tool.ruff.lint]
# Correctness-only for now (syntax errors, undefined names, unused imports/vars).
# Style/robustness rules (e.g. blind `except Exception`) are a tracked follow-up,
# not yet enforced here to avoid blocking on pre-existing debt.
select = ["E9", "F"]
